# Publish the PWA to GitHub Pages. Runs only when started by hand
# (Actions → "Deploy PWA to GitHub Pages" → Run workflow).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npx vite build
        env:
          # Served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
          # Without an export server, PDF/PNG are produced on the device.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_EXPORT_SERVER: ${{ vars.VITE_API_BASE && 'on' || 'off' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
