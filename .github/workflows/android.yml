# Build the Android app (APK) with Capacitor.
# - Every push that touches the frontend builds an APK and attaches it to the
#   workflow run ("Artifacts" at the bottom of the run page).
# - Pushing a tag like v1.2.0 also publishes it as a GitHub Release.
name: Android APK

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK (ANDROID_HOME) with licenses accepted;
      # Gradle downloads any missing platform/build-tools itself.
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - run: npm ci
      - name: Build the web app for Android (no export server)
        run: npx vite build
        env:
          VITE_EXPORT_SERVER: "off"
      - run: npx cap sync android

      - name: Use your own signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Gradle assembleRelease
        working-directory: frontend/android
        env:
          MATHPAD_VERSION_CODE: ${{ github.run_number }}
          MATHPAD_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p ../apk
          cp android/app/build/outputs/apk/release/app-release.apk "../apk/MathPad-${{ github.run_number }}.apk"
          ls -la ../apk

      - uses: actions/upload-artifact@v4
        with:
          name: MathPad-apk-${{ github.run_number }}
          path: apk/*.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body: |
            Tải `MathPad-*.apk` về điện thoại Android rồi mở để cài
            (cho phép "Cài ứng dụng không rõ nguồn gốc" khi được hỏi).
