# Build the desktop apps with Tauri:
#   macOS  -> MintMath_<ver>_universal.dmg (Apple Silicon + Intel)
#   Windows -> MintMath_<ver>_x64-setup.exe and .msi
# Files are attached to the run ("Artifacts"); tags v* also publish a Release.
name: Desktop apps

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/desktop.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles dmg
            out: frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: --bundles nsis,msi
            out: |
              frontend/src-tauri/target/release/bundle/nsis/*.exe
              frontend/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - run: npm ci
      - name: Build the app
        run: npx tauri build ${{ matrix.args }}
        env:
          VITE_EXPORT_SERVER: "off"

      - uses: actions/upload-artifact@v4
        with:
          name: MintMath-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.out }}
          retention-days: 30

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
