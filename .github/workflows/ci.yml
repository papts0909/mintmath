name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TeX (xelatex) and poppler for compile tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended \
            texlive-fonts-recommended lmodern poppler-utils fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p .
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (Tectonic warm-up compile runs during build)
        run: docker build -t mathpad-backend ./backend
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 mathpad-backend
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/export/pdf -H 'Content-Type: application/json' \
            --data @backend/tests/fixtures/sample.json -o sample.pdf
          head -c 5 sample.pdf | grep -q '%PDF-'

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TeX and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended \
            texlive-fonts-recommended lmodern poppler-utils fonts-dejavu-core
      - name: Backend venv
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Frontend deps and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test --trace off
        env:
          CI: "1"
