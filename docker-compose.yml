# Development: backend in Docker (Tectonic + poppler), frontend with Vite hot reload.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MATHPAD_CORS_ORIGINS: ${MATHPAD_CORS_ORIGINS:-http://localhost:5173}
      MATHPAD_RATE_LIMIT: ${MATHPAD_RATE_LIMIT:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      MATHPAD_BACKEND_URL: http://backend:8000
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
      VITE_GOOGLE_APP_ID: ${VITE_GOOGLE_APP_ID:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
